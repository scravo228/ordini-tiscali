
<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ordini Tiscali</title>

    <!-- PWA -->
    <link
        rel="manifest"
        href="./manifest.json"
    >

    <meta
        name="theme-color"
        content="#141414"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="schermataLogin" class="container">

    <h1>
        📦 Ordini Tiscali
    </h1>


    <input
        type="text"
        id="codiceLogin"
        placeholder="Codice punto vendita"
    >


    <input
        type="password"
        id="passwordLogin"
        placeholder="Password"
    >


    <button onclick="effettuaLogin()">
        🔑 Entra
    </button>


    <p id="erroreLogin"></p>

</div>




<!-- =====================================================
     APP PRINCIPALE
===================================================== -->

<div
    id="app"
    class="container"
    style="display:none;"
>


    <!-- =================================================
         TESTATA
    ================================================== -->

    <div class="testata">

        <h1>
            📦 Ordine Tiscali
        </h1>


        <div class="info-ordine">

            <div>

                🏪 Punto vendita:

                <strong id="puntoVendita">
                    -
                </strong>

            </div>


            <div>

                📅 Data:

                <strong id="dataOrdine">
                    -
                </strong>

            </div>


            <button
                type="button"
                onclick="esciAccount()"
                class="btn-esci"
            >

                🚪 Esci / Cambia account

            </button>

        </div>

    </div>




    <!-- =================================================
         EXCEL
    ================================================== -->

    <input
        type="file"
        id="fileExcel"
        accept=".xlsx"
    >


    <button onclick="caricaExcel()">

        🔄 Aggiorna lista Excel

    </button>




    <!-- =================================================
         FILTRO
    ================================================== -->

    <label class="filtro">

        <input
            type="checkbox"
            id="soloOrdinati"
            onchange="filtraProdotti()"
        >

        Mostra solo prodotti ordinati

    </label>




    <!-- =================================================
         LISTA PRODOTTI
    ================================================== -->

    <div id="listaProdotti"></div>




    <!-- =================================================
         RIEPILOGO
    ================================================== -->

    <div
        id="riepilogo"
        class="riepilogo"
    >

    </div>




    <!-- =================================================
         PULSANTI ORDINE
    ================================================== -->

    <button
        class="reset"
        onclick="azzeraOrdine()"
    >

        🗑️ Azzera ordine

    </button>




    <button
        class="pdf"
        onclick="creaPDF()"
    >

        📄 Crea PDF

    </button>




    <button
        class="invia"
        onclick="inviaATiscali()"
    >

        🛒 Invia a Tiscali

    </button>




    <button
        type="button"
        onclick="mostraMioAccount()"
    >

        👤 Il mio account

    </button>


</div>




<!-- =====================================================
     SCHERMATA INVIO ORDINE
===================================================== -->

<div
    id="schermataInvio"
    class="schermata-invio"
>

    <div class="box-invio">

        <div class="icona-invio">
            🛒
        </div>


        <h2>
            Invio ordine in corso
        </h2>


        <p id="testoInvio">
            Connessione a Tiscali...
        </p>


        <div class="barra-invio">

            <div
                id="barraInvio"
                class="barra-invio-avanzamento"
            ></div>

        </div>


        <p class="attendere-invio">

            ⏳ Attendere, non chiudere questa schermata

        </p>

    </div>

</div>




<!-- =====================================================
     JAVASCRIPT APP
===================================================== -->

<script src="app.js"></script>




<!-- =====================================================
     SERVICE WORKER PWA
===================================================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./service-worker.js")
            .then(registration => {

                console.log(
                    "PWA: Service Worker registrato:",
                    registration.scope
                );

            })
            .catch(error => {

                console.error(
                    "PWA: errore registrazione Service Worker:",
                    error
                );

            });

    });

}

</script>


</body>

</html>
